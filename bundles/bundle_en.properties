# NEXUS: Advanced Arsenal - English localization
# Keys: block.<mod>-<id>.name / .description / .details

block.nexus-arsenal-volt.name=NEXUS Volt
block.nexus-arsenal-volt.description=Electric turret. Fires charged orbs that burst into chain lightning on impact, striking nearby enemies.
block.nexus-arsenal-volt.details=Medium damage, high rate of fire. Hits ground and air targets. Requires power; coolant increases fire rate.

block.nexus-arsenal-frostbite.name=NEXUS Frostbite
block.nexus-arsenal-frostbite.description=Cryogenic turret. Fires ice shards that slow and freeze enemies, and extinguishes fires. Cryofluid creates a powerful icy burst with shrapnel.
block.nexus-arsenal-frostbite.details=Low damage, strong area control. Runs on water; cryofluid gives a bigger burst and longer freezing. Prioritizes fires within range.

block.nexus-arsenal-nx-titan.name=NEXUS Titan
block.nexus-arsenal-nx-titan.description=Heavy kinetic turret. Fires massive armor-piercing slugs with high direct damage and powerful recoil.
block.nexus-arsenal-nx-titan.details=Slow rate of fire, ground targets only. Graphite is the basic ammo; thorium pierces armor and hits up to three targets in a line.
