# NEXUS: Advanced Arsenal - українська локалізація
# Keys: block.<mod>-<id>.name / .description / .details

block.nexus-arsenal-volt.name=NEXUS Шок
block.nexus-arsenal-volt.description=Електрична турель. Стріляє зарядженими орбами, які при влученні розпадаються на ланцюгові блискавки та вражають сусідніх ворогів.
block.nexus-arsenal-volt.details=Середній урон, висока швидкість атаки. Б'є по наземних і повітряних цілях. Потребує енергії; охолодження підвищує швидкість стрільби.

block.nexus-arsenal-frostbite.name=NEXUS Заморозка
block.nexus-arsenal-frostbite.description=Кріогенна турель. Стріляє крижаними осколками, які сповільнюють і заморожують ворогів, а також гасить пожежі. Кріорідина створює потужний крижаний вибух з уламками.
block.nexus-arsenal-frostbite.details=Малий урон, але сильний контроль території. Працює на воді; кріорідина дає більший вибух і довше заморожування. Пріоритетно цілиться у пожежі в радіусі дії.

block.nexus-arsenal-nx-titan.name=NEXUS Титан
block.nexus-arsenal-nx-titan.description=Важка кінетична турель. Стріляє масивними бронебійними снарядами з великим прямим уроном і потужною віддачею.
block.nexus-arsenal-nx-titan.details=Повільна стрільба, б'є лише по наземних цілях. Графіт - базовий снаряд; торій пробиває броню й уражає до трьох цілей на шляху.
