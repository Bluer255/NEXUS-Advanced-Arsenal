# NEXUS: Advanced Arsenal - русская локализация
# Keys: block.<mod>-<id>.name / .description / .details

block.nexus-arsenal-volt.name=NEXUS Шок
block.nexus-arsenal-volt.description=Электрическая турель. Стреляет заряженными шарами, которые при попадании распадаются на цепные молнии и поражают соседних врагов.
block.nexus-arsenal-volt.details=Средний урон, высокая скорострельность. Бьёт по наземным и воздушным целям. Требует энергии; охлаждение повышает скорострельность.

block.nexus-arsenal-frostbite.name=NEXUS Заморозка
block.nexus-arsenal-frostbite.description=Криогенная турель. Стреляет ледяными осколками, которые замедляют и замораживают врагов, а также тушит пожары. Криожидкость создаёт мощный ледяной взрыв с осколками.
block.nexus-arsenal-frostbite.details=Малый урон, но сильный контроль территории. Работает на воде; криожидкость даёт больший взрыв и более долгое замораживание. Приоритетно целится в пожары в зоне досягаемости.

block.nexus-arsenal-nx-titan.name=NEXUS Титан
block.nexus-arsenal-nx-titan.description=Тяжёлая кинетическая турель. Стреляет массивными бронебойными снарядами с большим прямым уроном и мощной отдачей.
block.nexus-arsenal-nx-titan.details=Медленная стрельба, бьёт только по наземным целям. Графит - базовый снаряд; торий пробивает броню и поражает до трёх целей на пути.
